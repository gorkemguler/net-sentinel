<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}NetSentinel{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="/static/logo.svg">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header>
    <h1><img src="/static/logo.svg" class="logo" alt=""> NetSentinel</h1>
    <nav>
      {% set p = request.url.path %}
      <a href="/" class="{{ 'active' if p == '/' }}">Overview</a>
      <a href="/devices" class="{{ 'active' if p == '/devices' }}">Devices</a>
      <a href="/dns" class="{{ 'active' if p == '/dns' }}">DNS</a>
      <a href="/alerts" class="{{ 'active' if p == '/alerts' }}">Alerts</a>
      <a href="/events" class="{{ 'active' if p == '/events' }}">Events</a>
      <a href="/docs">API</a>
    </nav>
  </header>
  <main>
    {% block body %}{% endblock %}
  </main>
  <footer>NetSentinel v{{ version }} &middot; rendered {{ now.strftime('%Y-%m-%d %H:%M UTC') }}</footer>
</body>
</html>
