# Copy to inventory.ini and fill in your Pi(s).
# Ansible connects over SSH; key-based auth + a sudo-capable user assumed.

# ---- TWO PIs (reference layout) ----
[hub]
pi-hub ansible_host=192.168.1.2 ansible_user=pi

[sensor]
pi-sensor ansible_host=192.168.1.3 ansible_user=pi

# ---- ONE PI (hub + sensor on the same board) ----
# Delete the two blocks above and use this instead: the same host in both
# groups. Both plays run against it; each systemd unit pins its own role.
# [hub]
# pi-sentinel ansible_host=192.168.1.2 ansible_user=pi
# [sensor]
# pi-sentinel ansible_host=192.168.1.2 ansible_user=pi
# (also set netsentinel_hub_url=http://127.0.0.1:8080 below)

[netsentinel:children]
hub
sensor

[netsentinel:vars]
# The shared secret. Generate once: `python -c "import secrets;print(secrets.token_hex(32))"`
netsentinel_api_token=CHANGE_ME_32_BYTES_HEX

# Your LAN. The sensor will ONLY discover / scan this range.
netsentinel_local_subnet=192.168.1.0/24
netsentinel_monitor_interface=eth0

# Where the sensor finds the hub (usually the hub Pi's LAN IP).
netsentinel_hub_url=http://192.168.1.2:8080

# Notifications: none | log | ntfy | telegram | webhook
netsentinel_notify_backend=log
netsentinel_ntfy_topic=
netsentinel_repo_url=https://github.com/gorkemguler/net-sentinel.git
netsentinel_ref=main
