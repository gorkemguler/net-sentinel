---
- name: Install blocklist refresh cron (hub only)
  ansible.builtin.cron:
    name: netsentinel-refresh-blocklist
    minute: "17"
    hour: "4"
    user: root
    job: >-
      NETSENTINEL_BLOCKLIST_PATH=/var/lib/netsentinel/blocklist.txt
      /opt/netsentinel/src/deploy/scripts/refresh-blocklist.sh >/var/log/netsentinel-blocklist.log 2>&1

- name: Seed blocklist now (best effort, non-fatal)
  ansible.builtin.command:
    cmd: /opt/netsentinel/src/deploy/scripts/refresh-blocklist.sh
  environment:
    NETSENTINEL_BLOCKLIST_PATH: /var/lib/netsentinel/blocklist.txt
  register: seed
  changed_when: seed.rc == 0
  failed_when: false

- name: Ensure hub service is enabled and running
  ansible.builtin.systemd:
    name: netsentinel-hub.service
    state: started
    enabled: true

- name: Wait for the hub API
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ netsentinel_hub_port | default(8080) }}/healthz"
    status_code: 200
  register: health
  retries: 10
  delay: 3
  until: health.status == 200
